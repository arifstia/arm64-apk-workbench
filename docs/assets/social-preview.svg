<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111b26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <rect x="560" y="96" width="1" height="448" fill="#30363d"/>

  <g font-family="DejaVu Sans, Liberation Sans, sans-serif">
    <text x="80" y="248" fill="#ffffff" font-size="64" font-weight="bold" letter-spacing="-1">ARM64 APK</text>
    <text x="80" y="322" fill="#ffffff" font-size="64" font-weight="bold" letter-spacing="-1">WORKBENCH</text>
    <text x="80" y="382" fill="#22c55e" font-size="28" font-weight="bold">Audit · Decode · Build · Verify</text>
    <text x="80" y="446" fill="#8b949e" font-size="21" font-family="DejaVu Sans Mono, monospace">Ubuntu 26.04 ARM64 / Termux proot-distro</text>
    <text x="80" y="486" fill="#8b949e" font-size="21" font-family="DejaVu Sans Mono, monospace">MIT License · by arifstia</text>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="620" y="170" width="580" height="300" rx="12" fill="#010409" stroke="#30363d" stroke-width="2"/>
    <rect x="620" y="170" width="580" height="40" rx="12" fill="#161b22"/>
    <circle cx="648" cy="190" r="6" fill="#ff5f56"/>
    <circle cx="670" cy="190" r="6" fill="#ffbd2e"/>
    <circle cx="692" cy="190" r="6" fill="#27c93f"/>
    <text x="722" y="196" fill="#8b949e" font-size="15" font-family="DejaVu Sans Mono, monospace">apk-workbench build -s decoded/app</text>

    <g font-family="DejaVu Sans Mono, monospace" font-size="16">
      <text x="648" y="246" fill="#22c55e">$</text>
      <text x="670" y="246" fill="#c9d1d9">apk-workbench doctor</text>
      <text x="648" y="278" fill="#22c55e">[OK]</text>
      <text x="712" y="278" fill="#c9d1d9">Architecture: aarch64</text>
      <text x="648" y="310" fill="#22c55e">[OK]</text>
      <text x="712" y="310" fill="#c9d1d9">APKTool: 3.0.3</text>
      <text x="648" y="342" fill="#22c55e">[OK]</text>
      <text x="712" y="342" fill="#c9d1d9">aapt2: 2.19 (ARM64)</text>
      <text x="648" y="382" fill="#58a6ff">[+]</text>
      <text x="712" y="382" fill="#c9d1d9">Signature VALID (v2 + v3)</text>
      <text x="648" y="428" fill="#22c55e">✔ Build COMPLETE</text>
    </g>
  </g>

  <!-- chip -->
  <g transform="translate(1030, 520)">
    <rect x="0" y="0" width="170" height="52" rx="26" fill="#132b1e" stroke="#22c55e" stroke-width="2"/>
    <text x="85" y="34" text-anchor="middle" fill="#22c55e" font-size="22" font-weight="bold" font-family="DejaVu Sans Mono, monospace">aarch64</text>
  </g>
</svg>
